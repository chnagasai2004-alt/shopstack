[project]
name = "shopstack"
version = "1.0.0"
description = "A feature-rich FastAPI ecommerce starter"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.1.9",
  "jinja2==3.1.5",
  "python-multipart==0.0.20",
  "itsdangerous==2.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
